name: Use original organiser EPTC template

on:
  push:
    paths:
      - 'presentations/organiser_template.pptx'
      - 'presentations/apply_organiser_template.py'
      - '.github/workflows/presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install editable PowerPoint library
        run: python -m pip install "python-pptx==1.0.2" "Pillow>=10.0"
      - name: Build slides with the untouched organiser header/footer
        id: build
        shell: bash
        run: |
          if [ -f presentations/organiser_template.pptx ]; then
            python presentations/apply_organiser_template.py
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Upload your original pptx as presentations/organiser_template.pptx. The workflow will then create the 35-slide exact-template deck."
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify template-backed PowerPoint
        if: steps.build.outputs.produced == 'true'
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pathlib import Path
          from hashlib import sha256
          base=Presentation('presentations/organiser_template.pptx')
          outpath=Path('presentations/EPTC_2026_Official_Template_Presentation.pptx')
          out=Presentation(str(outpath))
          assert len(out.slides)==35, len(out.slides)
          assert outpath.stat().st_size > 70000
          original={sha256(s.image.blob).hexdigest() for s in base.slides[0].shapes if s.shape_type==13}
          current={sha256(s.image.blob).hexdigest() for s in out.slides[0].shapes if s.shape_type==13}
          assert original<=current, "Original organizer images not embedded faithfully"
          combined='\n'.join(s.text for p in out.slides for s in p.shapes if s.has_text_frame)
          for required in ('80.455','0.010841','9.46%','Yi, M.','Wen, J.','64.82%'):
              assert required in combined, required
          print('PASS: 35 slides, original assets lossless, report findings preserved')
          PY
      - name: Commit official-template deck
        if: steps.build.outputs.produced == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/EPTC_2026_Official_Template_Presentation.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Publish slides on original EPTC organiser template [skip ci]"
            git push
          fi
      - name: Upload editable PowerPoint
        if: steps.build.outputs.produced == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EPTC-2026-OFFICIAL-TEMPLATE-35-SLIDES
          path: presentations/EPTC_2026_Official_Template_Presentation.pptx
          if-no-files-found: error
