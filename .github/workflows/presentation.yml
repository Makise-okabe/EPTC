name: Build EPTC competition presentation

on:
  push:
    paths:
      - 'presentations/*.py'
      - '.github/workflows/presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PowerPoint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-pptx==1.0.2" "Pillow>=10.0"
      - name: Generate editable presentation
        run: python presentations/build_deck.py
      - name: Verify saved PPTX, shape layout and citations
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pathlib import Path
          f = next(Path("presentations").glob("EPTC_2026_Student_Innovation_Challenge_Presentation.pptx"))
          p = Presentation(f)
          assert len(p.slides) == 30, len(p.slides)
          txt = "\n".join(sh.text for slide in p.slides for sh in slide.shapes if sh.has_text_frame)
          for expected in ("80.455", "0.010841", "9.46%", "88.22%", "64.82%", "Yenigun", "Yi, M.", "Prasher"):
            assert expected in txt, expected
          for banned in ("V6A", "V4B", "V3B", "V4D", "Draft"):
            assert banned not in txt, banned
          print(f"PASS slides={len(p.slides)} size={f.stat().st_size} bytes")
          PY
      - name: Publish deck to repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/EPTC_2026_Student_Innovation_Challenge_Presentation.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Build competition-ready EPTC slide deck [skip ci]"
            git push
          fi
      - name: Upload PowerPoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPTC-2026-Competition-PowerPoint
          path: presentations/EPTC_2026_Student_Innovation_Challenge_Presentation.pptx
          if-no-files-found: error
